services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    environment:
      # Host networking lets the container reach Ollama on loopback
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - PORT=8080
      # Disable signup after creating the first admin account
      - ENABLE_SIGNUP=true
      # No telemetry, no external model hub calls
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped