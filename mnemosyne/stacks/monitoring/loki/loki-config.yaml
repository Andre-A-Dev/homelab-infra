# ============================================================================
# Loki - single-binary (monolithic) config for Mnemosyne (Pi 5, arm64)
# Filesystem storage, no object store. 30-day retention via the compactor.
# Reference: grafana/loki:3.7.2
# ============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h            # retention requires a 24h index period

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h

limits_config:
  retention_period: 720h        # 30 days - matches Prometheus retention
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true          # enables the log-volume endpoint (Grafana Drilldown)

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true       # WITHOUT this, logs live forever (only compaction runs)
  retention_delete_delay: 2h    # safety buffer before chunks are actually removed
  delete_request_store: filesystem   # REQUIRED when retention is enabled - else Loki crashloops

analytics:
  reporting_enabled: false
