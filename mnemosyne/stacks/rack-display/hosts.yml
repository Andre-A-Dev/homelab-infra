# Display order and naming only. Liveness and uptime expectation come from
# Prometheus itself, so nothing here can drift out of sync with the scrape
# config.
#
# expect is DERIVED, not declared:
#   ephemeral="true" on the target  ->  intermittent  (grey when absent)
#   otherwise                       ->  always_on     (red when absent)
# Set expect: here only to override that for a single host.
#
# Verified 2026-09-08. relabel_configs rewrites instance to the hostname
# label, so instances are bare names, not host:port.

hosts:
  - name: Mnemosyne
    sources:
      - { job: node-exporter, instance: mnemosyne }

  - name: Boreas
    sources:
      - { job: node-exporter, instance: boreas }

  - name: Hephaestus
    sources:
      - { job: node-exporter, instance: hephaestus }

  - name: Zephyros
    sources:
      - { job: node-exporter, instance: zephyros }

  - name: Daidalos
    sources:
      - { job: node-exporter, instance: daidalos }

  # Dual boot: whichever exporter answers tells us which OS is running.
  # The host counts as up if either source does.
  - name: AstraeusNX
    sources:
      - { job: node-exporter, instance: AstraeusNX, os: linux }
      - { job: windows, instance: Astraeus, os: windows }

  # CachyOS only — no Windows install, single source.
  - name: Proteus
    sources:
      - { job: node-exporter, instance: Proteus }
