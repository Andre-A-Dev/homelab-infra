<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- dusk tile -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- barograph trace: area fill + bold brass line -->
  <path d="M4 21 L10 15 L16 19 L22 11 L28 16 L28 26 L4 26 Z" fill="url(#fill)"/>
  <path d="M4 21 L10 15 L16 19 L22 11 L28 16"
        fill="none" stroke="#e0a458" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "now" marker at the trailing end -->
  <circle cx="28" cy="16" r="2.4" fill="#e0a458" stroke="#0e1219" stroke-width="1"/>
</svg>
