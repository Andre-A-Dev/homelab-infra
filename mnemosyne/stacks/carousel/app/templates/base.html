<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EDF1ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131C17" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Karussell">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <title>{% block title %}Karussell{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt="" width="30" height="30"><span>Karussell</span></a>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
