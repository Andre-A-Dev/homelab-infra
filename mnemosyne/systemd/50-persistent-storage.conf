# =============================================================================
# 50-persistent-storage.conf  →  /etc/systemd/journald.conf.d/
# =============================================================================
# Overrides /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf,
# which ships with Raspberry Pi OS and forces Storage=volatile to spare SD
# cards from write wear.
#
# Mnemosyne boots from SSD, so that trade-off does not apply — and a volatile
# journal has two costs: every reboot erases the logs, and nothing ever appears
# under /var/log/journal, which is the only place Alloy's loki.source.journal
# looks. Loki therefore received zero journal entries for months while both
# Alloy and Loki reported healthy and logged no error. The setting was
# invisible in /etc/systemd/journald.conf and only showed up under
# `systemd-analyze cat-config systemd/journald.conf`.
#
# Drop-ins in /etc override those in /usr/lib; the number only orders drop-ins
# against each other, so 50 > 40 makes this win.
#
# Setting Storage= in /etc/systemd/journald.conf directly does NOT work: a
# drop-in beats the main file regardless of its numbering.
#
# After changing this, journald does not migrate on restart by itself:
#   sudo systemctl restart systemd-journald
#   sudo systemctl restart systemd-journal-flush
# Verify with: journalctl -u systemd-journald -n 5 | grep "Journal ("
# It must say "System Journal (/var/log/journal/...)", not "Runtime Journal".
# =============================================================================

[Journal]
Storage=persistent

# 500 MB on a 59 GB root partition. Without a cap the journal grows to 10% of
# the filesystem by default.
SystemMaxUse=500M
