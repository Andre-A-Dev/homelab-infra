# /etc/network-quality.conf — chmod 600 (holds the ntfy topic)
#
# Two runs validate the cellar move:
#   1. From Daidalos → Mnemosyne : validates the SWITCH (expect ~940 Mbit/s)
#   2. From an upstairs wired host → Mnemosyne : validates the MESH HOP
#
# Copy this file, adjust PATH_LABEL and the thresholds per run.

IPERF_TARGET="192.168.1.10"      # Mnemosyne (runs iperf3 -s)
IFACE="auto"                       # auto = interface of the default route

# --- Profile A: cellar-internal (Daidalos → Mnemosyne, over the switch) ------
# PATH_LABEL="cellar_switch"
# MIN_THROUGHPUT_MBPS=900
# MAX_RETR=0
# MAX_LOSS_PCT=0
# MAX_RTT_AVG_MS=2
# MAX_MDEV_MS=0.5

# --- Profile B: mesh uplink (upstairs host → Mnemosyne, over WLAN mesh) -------
PATH_LABEL="cellar_mesh_uplink"
MIN_THROUGHPUT_MBPS=100            # WLAN-mesh reality; raise if your backhaul is 5GHz-strong
MAX_RETR=50
MAX_LOSS_PCT=0.1
MAX_RTT_AVG_MS=25
MAX_MDEV_MS=10

# --- Test durations ----------------------------------------------------------
IPERF_DURATION=30                  # seconds per direction
PING_COUNT=3000                    # 3000 @ 0.2s = 10 min stability window
PING_INTERVAL=0.2

# --- Notifications & metrics -------------------------------------------------
NTFY_URL="https://ntfy.sh/CHANGE_ME_network"
TEXTFILE_DIR="/var/lib/node_exporter/textfile_collector"
